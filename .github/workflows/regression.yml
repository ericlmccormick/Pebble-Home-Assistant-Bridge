name: Static regression checks
on:
  push:
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax (app and shared audio SDK)
        run: |
          node --check src/pkjs/index.js
          node --check src/pkjs/ha_audio.js
      - name: Plugin-only architecture and Pebble message contract
        run: node tests/audio-flow.test.cjs
      - name: Progressive WAV playback and integrity tests
        run: node tests/progressive-audio.test.cjs
      - name: Sentence prefetch, ordered chunks and Bluetooth continuity
        run: node tests/sentence-prefetch.test.cjs
      - name: Day and night text, icon and selection contrast
        run: node tests/theme-contrast.test.cjs
      - name: First-frame theme and cached solar times
        run: node tests/theme-startup.test.cjs
      - name: Offline catalog, scene actions, and visibility regression
        run: node tests/control-cache.test.cjs
      - name: Inline room navigation and action mapping
        run: node tests/inline-rooms.test.cjs
      - name: On-watch settings and fan discovery recheck
        run: node tests/watch-settings.test.cjs
      - name: Clay device filter and room header behavior
        run: node tests/phone-filter.test.cjs
      - name: Concurrent live status and BLE queue regression
        run: node tests/status-concurrency.test.cjs
      - name: Phone-only startup state prefetch regression
        run: node tests/startup-prefetch.test.cjs
      - name: Static watch SDK interface validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c=Path('src/c/main.c').read_text()
          watch=Path('src/c/ha_audio.c').read_text()
          header=Path('src/c/ha_audio.h').read_text()
          phone=Path('src/pkjs/index.js').read_text()
          assert '#include "ha_audio.h"' in c
          assert 'ha_audio_handle_message(iterator)' in c
          assert 'ha_audio_handle_message' in watch and 'ha_audio_handle_message' in header
          assert 'AUDIO_RESET' in watch and 'AUDIO_CHUNK' in watch
          assert 'AUDIO_SENTENCE_END' in watch and 'AUDIO_STOP' in watch
          assert 's_pcm_frames[2][PLAYBACK_PCM_SAMPLES]' in watch
          assert 'mic_stream_to_phone' not in c
          assert 'new WebSocket' not in phone and '/api/conversation/process' not in phone
          assert 'USE_BUILTIN_CONNECTION' not in phone
          controls=Path('src/c/ha_controls.c').read_text()
          start=controls.index('static void home_load(')
          end=controls.index('static void home_unload(',start)
          assert 'window_single_click_subscribe(' not in controls[start:end], 'Home load must not register clicks outside a ClickConfigProvider'
          assert 'window_set_click_config_provider(w,home_click_config)' in controls[start:end]
          assert 'static void home_click_config(void *context)' in controls
          print('Bridge-only native audio and startup click-config contract passed')
          PY
