name: Build and publish direct PBW
on:
  workflow_dispatch:
  push:
    branches: [continuous-native-conversation, fix/always-refresh-visible-status, 'release/control-center-v2.0.0']
    paths:
      - 'package.json'
      - 'src/**'
      - 'tests/**'
      - 'resources/**'
      - 'images/**'
      - 'wscript'
      - '.github/workflows/direct-pbw.yml'
permissions:
  contents: write
concurrency:
  group: direct-pbw-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Install Pebble build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g libsndio7.0
      - name: Check manifest and PebbleKit JS
        run: |
          node -e "const p=require('./package.json');if(p.pebble.projectType!=='native'||p.pebble.sdkVersion!=='3')process.exit(1)"
          node --check src/pkjs/index.js
          node --check src/pkjs/ha_audio.js
          node tests/audio-flow.test.cjs
          node tests/progressive-audio.test.cjs
          node tests/sentence-prefetch.test.cjs
          node tests/touch-controls.test.cjs
          node tests/theme-contrast.test.cjs
          node tests/theme-startup.test.cjs
          node tests/home-layout-navigation.test.cjs
          node tests/door-ui.test.cjs
          node tests/status-layout.test.cjs
          node tests/control-cache.test.cjs
          node tests/status-concurrency.test.cjs
          node tests/startup-prefetch.test.cjs
          node tests/phone-filter.test.cjs
          node tests/inline-rooms.test.cjs
          node tests/watch-settings.test.cjs
          node tests/device-details.test.cjs
      - name: Install firmware-compatible Pebble SDK
        run: |
          uv tool install pebble-tool
          pebble sdk install 4.44
          pebble sdk activate 4.44
      - name: Build Pebble app
        run: pebble build
      - name: Prepare installable PBW
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(build/*.pbw)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected one built .pbw, found ${#files[@]}" >&2
            exit 1
          fi
          mkdir -p direct-download
          cp "${files[0]}" direct-download/home-assistant-control-center.pbw
      - uses: actions/upload-artifact@v4
        with:
          name: home-assistant-control-center-build
          path: direct-download/home-assistant-control-center.pbw
          if-no-files-found: error
      - name: Publish directly installable PBW to GitHub Releases
        if: github.ref == 'refs/heads/continuous-native-conversation' || github.ref == 'refs/heads/release/control-center-v2.0.0' || github.ref == 'refs/heads/fix/always-refresh-visible-status'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG=dev-continuous-native-conversation
          if [[ "$GITHUB_REF_NAME" == "fix/always-refresh-visible-status" ]]; then TAG=dev-always-refresh-visible-status; fi
          if [[ "$GITHUB_REF_NAME" == "release/control-center-v2.0.0" ]]; then TAG=dev-control-center-v2-test; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Latest development PBW" --prerelease \
              --notes "Rolling continuous-native-conversation branch development build. Install the .pbw directly; GitHub Actions artifacts are ZIP archives."
          fi
          gh release upload "$TAG" direct-download/home-assistant-control-center.pbw --clobber
          echo "### Direct PBW download" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download home-assistant-control-center.pbw](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/home-assistant-control-center.pbw)" >> "$GITHUB_STEP_SUMMARY"
